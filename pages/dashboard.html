<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Peserta - Lily Fest</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="dashboard-wrap">

        <div class="dashboard-header">
            <p class="judul-kecil">LILY FEST</p>
            <h1>Dashboard Peserta</h1>
        </div>

        <div class="table-card">
            <div class="table-card-top">
                <h2>Daftar Peserta</h2>
            </div>
            <p id="pesanKosong">Belum ada peserta terdaftar.</p>

            <table id="tabel-peserta">
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Email</th>
                        <th>Kelas</th>
                        <th>Jurusan</th>
                        <th>Kegiatan</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tbody-peserta">
                </tbody>
            </table>
        </div>
    </div>
  <script src="../js/script.js"></script>
</body>
</html>
